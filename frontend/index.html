<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>核銷系統（練習骨架）</title>
    <!-- 先載入執行環境的設定（API 位址、環境、版本）：開發時由 Vite 提供，Staging 由後端提供 -->
    <script src="/config.js" vite-ignore></script>
    <style>
      :root {
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
        line-height: 1.6;
        color: #1f2933;
        background: #f5f6f8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      a { color: #1d4ed8; }
      button {
        font: inherit;
        padding: 8px 14px;
        border: 1px solid #c5cbd3;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .env-banner { padding: 6px 16px; background: #b45309; color: #fff; font-weight: 600; text-align: center; }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e3e6ea;
      }
      .brand { font-weight: 700; color: inherit; text-decoration: none; }
      .account { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px 72px; }
      h1 { margin: 0 0 16px; font-size: 1.5rem; line-height: 1.3; }
      .status { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .status li { padding: 12px 16px; background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; font-size: 1.1rem; }
      .ok { color: #047857; }
      .bad { color: #b91c1c; }
      .unknown { color: #6b7280; }
      .hint { color: #4b5563; }
      .error { color: #b91c1c; }
      .user-list { display: grid; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
      .user-list button {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 12px;
        width: 100%;
        text-align: left;
      }
      .email { color: #6b7280; overflow-wrap: anywhere; }
      .version { position: fixed; right: 12px; bottom: 8px; font-size: 0.85rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
