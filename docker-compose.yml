services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: claims
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
