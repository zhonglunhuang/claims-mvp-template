# CI：開 PR 到 stage、合併進 stage 時，GitHub Actions 跑一次 make check，結果顯示在 PR 頁面下方。
name: check

on:
  pull_request:
    branches: [stage]
  push:
    branches: [stage]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://claims:local_only@127.0.0.1:5432/claims
      API_PORT: 4000
      API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # SESSION_SECRET 每次執行時才產生，檔案裡不寫任何值
      - run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: make check
